aid: kabal
name: Kabal
description: >-
  Kabal is the energy industry's leading logistics management SaaS platform.
  Founded in Norway in 2011 (formerly Wellit), Kabal provides an integrated,
  cloud-native platform that manages cargo, marine, transport, personnel,
  warehouse, rig and installation logistics across both offshore and onshore
  operations for oil & gas operators. The platform spans planning, execution and
  optimization, plus cost and emissions tracking and KPI reporting, connecting
  operators with their suppliers and vessels to share business-critical logistics
  data. Kabal is trusted by energy supermajors including ExxonMobil, Shell,
  Chevron, BP, TotalEnergies, Equinor, Petronas, Repsol, Eni and ADNOC, with tens
  of thousands of users across dozens of countries. Kabal received a growth
  investment from Insight Partners in 2023.
